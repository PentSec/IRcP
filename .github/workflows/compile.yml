name: Compile and deploy

on:
  push:
    branches: [main]
  # Run it by hand after touching a Pages setting, without pushing a commit.
  workflow_dispatch:

# peaceiris/actions-gh-pages pushes to the deploy branch with the job token.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build CSS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build
        run: bun run build

      - name: Check formatting
        run: bun run format:check

      # Publishes ./dist as the root of the deploy branch. bd-scss only writes CSS, so
      # the background and .nojekyll are added by scripts/postbuild.mjs before this runs.
      - name: Publish to the deploy branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: deploy
          publish_dir: ./dist
